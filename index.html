<script>
const app=document.getElementById('app'),home=document.getElementById('home'),chatView=document.getElementById('chatView'),thread=document.getElementById('thread');

const sectionQuestions={me:'Who are you? Tell me what makes you different.',experience:'Walk me through your professional experience.',projects:'Show me the work you are most proud of.',skills:'What can you build and what technologies do you use?',contact:'How can I contact you or discuss an opportunity?',location:'Where are you based and what work arrangements fit you?'};
const content={
me:`<div class="portraitCard"><img src="assets/duong-professional.webp" alt="Professional portrait of Duong Le"><div><div class="eyebrow">Duong (Tyler) Le · Dallas–Fort Worth</div><h2>Builder energy. People skills. Software engineer mindset.</h2><p>I'm a software engineer who likes being where <strong>technology meets real people and real problems</strong>. I enjoy building, presenting, listening, troubleshooting and turning ideas into software people can actually use.</p></div></div><p class="miniBio">My background spans <strong>enterprise software at NTT DATA</strong>, <strong>FinTech and business-platform development at Infinity Management</strong>, and customer-facing digital operations and leadership at <strong>GongCha and Liuyishou</strong>.</p><div class="infoGrid"><div class="info"><b>Enterprise + AI</b><span>NTT DATA · Dell/Perot data web application · healthcare technology</span></div><div class="info"><b>Web + Mobile</b><span>React, Node.js, APIs, PostgreSQL, Expo / React Native, Android & iOS</span></div><div class="info"><b>Education</b><span>B.S. Software Engineering · UTD · Dec 2025</span></div></div><p>At <strong>Infinity Management</strong>, I design and develop SyntaxSC across accounting, financial reporting, tax-preparation, CRM, payroll and other business workflows. Previously at <strong>NTT DATA Services</strong>, I worked as a Software Development Specialist on Dell/Perot Systems-related and NTT DATA Healthcare projects. My retail leadership background strengthened my communication, training, customer experience and fast decision-making skills.</p><p><strong>How I learn:</strong> when new technology catches my attention, I want to understand the mechanism behind it — not just use it. I learn how the pieces connect, build with it, test the edge cases and look for ways to simplify or improve the experience.</p><div class="chips"><span class="tag">Full-stack builder</span><span class="tag">Enterprise software</span><span class="tag">AI + data integration</span><span class="tag">FinTech</span><span class="tag">Android / iOS</span><span class="tag">Customer-first</span></div>`,
experience:`<p>My experience combines <strong>software engineering, AI/data integration, financial technology, healthcare technology, web/mobile products and hands-on leadership</strong>.</p><div class="experienceTimeline">
<div class="experienceCard"><div class="expTop"><div><div class="expRole">Software Engineer · IT & Digital Product</div><div class="expCompany">Infinity Management · Dallas, TX</div></div><div class="expDate">May 2024 — Present</div></div><p class="expSummary">Design and develop SyntaxSC, an integrated web/mobile business platform connecting accounting, financial reporting, tax preparation, CRM, payroll and operational workflows.</p><ul><li>Architect and develop <strong>FinSight</strong>, an internal QuickBooks-style financial environment designed to reduce dependence on separate accounting software.</li><li>Build Profit & Loss, Balance Sheet, Trial Balance, General Ledger, Cash Flow, AR/AP Aging, Bank Summary, Bank Reconciliation and Inventory Valuation workflows.</li><li>Develop AI-assisted CSV/Excel imports and intelligent field-mapping workflows backed by SQL/PostgreSQL data processing.</li><li>Build QuickBooks migration/import workflows and financial-data transformation features.</li><li>Design and develop <strong>SyntaxPrep</strong>, a professional tax-preparation workflow inspired by platforms such as MyTAXPrepOffice, including taxpayer/client records, return workflows, filing status and IRS/Texas filing-payment integration architecture.</li><li>Develop REST APIs, database schemas, frontend/mobile integrations, UAT/release validation, debugging and stakeholder demonstrations across the platform.</li></ul><div class="chips"><span class="tag">Node.js</span><span class="tag">PostgreSQL</span><span class="tag">REST APIs</span><span class="tag">JavaScript</span><span class="tag">Docker</span><span class="tag">AI-assisted workflows</span></div></div>
<div class="experienceCard"><div class="expTop"><div><div class="expRole">Software Development Specialist</div><div class="expCompany">NTT DATA Services · Plano, TX</div></div><div class="expDate">Aug 1, 2022 — Dec 31, 2023</div></div><p class="expSummary">Worked across enterprise web, data and healthcare technology projects within NTT DATA's Plano engineering organization.</p><div class="subProject"><b>Dell / Perot Systems-related project</b><span>Designed and integrated AI-assisted tools into a data-focused web application, helping improve how users interacted with and analyzed information. Supported feature integration, testing, debugging, data validation and application improvements without tying the work to an unverified AI model or cloud stack.</span></div><div class="subProject"><b>NTT DATA Healthcare project</b><span>Contributed to healthcare application and data workflows, supporting software development, integration, testing, troubleshooting and cross-functional delivery in an enterprise environment.</span></div><div class="chips"><span class="tag">Software development</span><span class="tag">AI integration</span><span class="tag">Web applications</span><span class="tag">Data workflows</span><span class="tag">Healthcare technology</span><span class="tag">Testing + debugging</span></div></div>
<div class="experienceCard"><div class="expTop"><div><div class="expRole">General Manager & Digital Product Operations Lead</div><div class="expCompany">GongCha · Dallas, TX</div></div><div class="expDate">Aug 2021 — Jun 2024</div></div><p class="expSummary">Combined high-volume retail leadership with digital product, loyalty and customer-experience operations.</p><ul><li>Managed daily operations, customer relationships, sales/service KPIs, promotions and a <strong>15-person team</strong>, including scheduling, training and escalations.</li><li>Trained employees on product knowledge, selling techniques, POS/loyalty technology, promotions and customer engagement.</li><li>Used loyalty data, sales trends and customer feedback to refine promotions and service execution, contributing to approximately <strong>20% higher engagement in three months</strong>.</li><li>Supported customer-facing digital/rewards workflows and translated real user feedback into practical product and operational improvements.</li></ul><div class="chips"><span class="tag">Leadership</span><span class="tag">Customer experience</span><span class="tag">Loyalty technology</span><span class="tag">KPIs</span><span class="tag">Training</span><span class="tag">Digital operations</span></div></div>
<div class="experienceCard"><div class="expTop"><div><div class="expRole">Retail Operations Lead</div><div class="expCompany">Liuyishou Hotpot · Richardson, TX</div></div><div class="expDate">Dec 2024 — Jan 2026</div></div><p class="expSummary">Led customer experience and day-to-day retail execution in a fast-moving, high-volume environment.</p><ul><li>Led staff training and scheduling, promotional execution, store presentation and real-time customer/operational issue resolution.</li><li>Adjusted staffing and operating priorities using frontline feedback and service trends to maintain smooth execution during peak periods.</li><li>Partnered with managers to protect service quality, communicate changes clearly and keep the team aligned under pressure.</li></ul><div class="chips"><span class="tag">Operations</span><span class="tag">Team leadership</span><span class="tag">Scheduling</span><span class="tag">Promotions</span><span class="tag">Customer service</span></div></div>

projects:`<p>These projects show how I work: <strong>understand the workflow → build the system → test the edge cases → explain the value.</strong> My portfolio combines software engineering with real customer, sales, data and operations problems.</p><div class="projectGrid"><div class="project"><small>BUSINESS + FINTECH PLATFORM</small><h3>SyntaxSC</h3><p>Multi-module web/mobile business platform spanning CRM, FinSight accounting and reporting, SyntaxPrep tax workflows, payroll, field service, construction and client operations. I work across requirements, APIs, PostgreSQL data flows, testing, troubleshooting, release validation and stakeholder demonstrations.</p><p class="stack">Node.js · Express · PostgreSQL · REST APIs · JavaScript · Docker · Git</p><div class="actionRow"><a class="action primary" href="https://web.syntaxsc.com/index.html?session_expired=true&reason=Session%20expired%20due%20to%20inactivity" target="_blank" rel="noreferrer">Open SyntaxSC ↗</a></div></div><div class="project"><small>WEB + MOBILE REWARDS PRODUCT</small><h3>DFW Pass</h3><p>Cross-platform rewards product spanning web and Expo / React Native Android and iOS workflows. My work includes mobile integration, businesses and offers, reward/check-in concepts, merchant/admin workflows, API/data coordination and release/build validation.</p><p class="stack">Expo · React Native · JavaScript · Node.js · PostgreSQL · REST APIs</p><div class="actionRow"><a class="action primary" href="https://dfw-pass.com/" target="_blank" rel="noreferrer">Visit DFW Pass ↗</a></div></div><div class="project"><small>AI + ACCOUNTING DATA</small><h3>FinSight AI Import</h3><p>AI-assisted CSV/Excel mapping workflows that transform inconsistent accounting data into structured application records and financial-reporting formats, with validation, exception handling and SQL/PostgreSQL-backed processing.</p><p class="stack">JavaScript · SQL · PostgreSQL · REST APIs · AI-assisted mapping</p></div><div class="project"><small ate Drone Prototype</h3><p>Built autonomous quadcopter navigation logic using GPS/sensor data, computer vision and ROS; added real-time obstacle detection, RTSP drone-to-vehicle video communication and AWS IoT telemetry for cloud logging, monitoring and remote debugging.</p><p class="stack">Python · C++ · OpenCV · Linux · ROS/Gazebo · RTSP · AWS IoT Core</p></div><div class="project"><small>JAVA FULL STACK</small><h3>CSF 2.0 Risk App</h3><p>Cybersecurity assessment app with Spring Boot REST APIs, React UI, PostgreSQL, JWT authentication, autosave, run tracking and visual KPI/radar reporting.</p><p class="stack">Java · Spring Boot · React · TypeScript · PostgreSQL · Docker</p></div><div class="project"><small>EMERGING AI</small><h3>Agentic AI Systems</h3><p>Hands-on study and implementation planning around MCP, RAG, multi-agent orchestration, LLM routing, vector search and knowledge-graph concepts, focused on practical business workflows rather than AI for its own sake.</p><p class="stack">Python · MCP · RAG · pgvector · LLM routing · Knowledge-graph concepts</p></div><div class="project"><small>SYSTEMS RELIABILITY</small><h3>Monitoring + Incident Response</h3><p>Built Linux/Python monitoring, alert logging, SQL-backed incident tracking and runbook-style recovery workflows to practice fault isolation, escalation, root-cause analysis and service restoration.</p><p class="stack">Linux · Python · Shell · SQL · Monitoring · RCA</p></div></div>`,

const aura=document.getElementById('cursorAura'),aura2=document.getElementById('cursorAura2');let targetX=innerWidth*.2,targetY=innerHeight*.3,x=targetX,y=targetY,x2=x,y2=y;window.addEventListener('pointermove',e=>{targetX=e.clientX;targetY=e.clientY},{passive:true});function animateAura(){x+=(targetX-x)*.13;y+=(targetY-y)*.13;x2+=(targetX-x2)*.055;y2+=(targetY-y2)*.055;aura.style.transform=`translate3d(${x}px,${y}px,0)`;aura2.style.transform=`translate3d(${x2}px,${y2}px,0)`;requestAnimationFrame(animateAura)}animateAura();
