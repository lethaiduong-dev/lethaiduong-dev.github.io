<div class="app" id="app"><div class="noise"></div><div class="ambient a"></div><div class="ambient b"></div><div class="ambient c"></div><div class="cursorAura" id="cursorAura"></div><div class="cursorAura2" id="cursorAura2"></div><header class="topbar"><a class="brand" href="#" id="brandHome"><span class="logo">DL</span><span>About Duong</span></a><div class="topActions"><a class="iconBtn" href="https://github.com/lethaiduong-dev" target="_blank" rel="noreferrer" aria-label="GitHub">⌘</a><a class="iconBtn" href="mailto:Lethaiduong1912@gmail.com" aria-label="Email">✉</a></div></header><main class="screen"><section class="home" id="home"><p class="hello">Hey, I'm Duong <span class="wave">👋</span></p><h1>Software Engineer</h1><p class="slogan">Code the idea. Explain the why. Make it real.</p><img class="heroAvatar" src="assets/duong-avatar.webp" alt="AI portrait of Duong Le" /><div class="searchWrap"><input class="search" id="homeSearch" autocomplete="off" placeholder="Ask me anything…" aria-label="Ask Duong's portfolio"/><button class="send" id="homeSend" aria-label="Send">↑</button></div><div class="homeNav" id="homeNav"><button data-section="me"><span class="ico">◉</span>Me</button><button data-section="projects"><span class="ico">▣</span>Projects</button><button data-section="skills"><span class="ico">✦</span>Skills</button><button data-section="contact"><span class="ico">⌁</span>Contact</button><button data-section="location"><span class="ico">⌖</span>Location</button></div><div class="hint">Interactive portfolio · ask about my work, experience, projects, skills, AI, leadership or availability</div></section><section class="chatView" id="chatView"><div class="chatHeader"><img class="tinyAvatar" src="assets/duong-avatar.webp" alt="Duong Le avatar"></div><div class="thread" id="thread"></div></section><div class="chatControls" id="chatControls"><div class="dock" id="dock"><button data-section="me">◉ Me</button><button data-section="projects">▣ Projects</button><button data-section="skills">✦ Skills</button><button data-section="contact">⌁ Contact</button><button data-section="location">⌖ Location</button></div><div class="chatInputWrap"><input id="chatInput" class="chatInput" autocomplete="off" placeholder="Ask me anything…"><button id="chatSend" class="chatSend">↑</button></div></div><button class="homeBtn" id="homeBtn" title="Back home">⌂</button></main></div>
<script>
const app=document.getElementById('app'),home=document.getElementById('home'),chatView=document.getElementById('chatView'),thread=document.getElementById('thread');const avatar='assets/duong-avatar.webp';const sectionQuestions={me:'Who are you? Tell me what makes you different.',projects:'Show me the work you are most proud of.',skills:'What can you build and what technologies do you use?',contact:'How can I contact you or discuss an opportunity?',location:'Where are you based and what work arrangements fit you?'};const content={me:`<div class="portraitCard"><img src="assets/duong-professional.webp" alt="Professional portrait of Duong Le"><div><div class="eyebrow">Duong (Tyler) Le · Dallas–Fort Worth</div><h2>Builder energy. People skills. Software engineer mindset.</h2><p>I'm a Gen-Z software engineer who likes being where <strong>technology meets real people and real problems</strong>. I don't want to live only behind a screen — I like building, presenting, listening, troubleshooting and turning ideas into something people can actually use.</p></div></div><p class="miniBio">I bring <strong>4+ years developing and maintaining web & mobile applications</strong> and <strong>4+ years in customer service and management</strong>, so I can move comfortably between code, products, teams and customers.</p><div class="infoGrid"><div class="info"><b>Web + Mobile</b><span>React, Node.js, APIs, databases, Expo / React Native, Android & iOS</span></div><div class="info"><b>Customer + Management</b><span>Training, scheduling, KPIs, promotions, demos, service recovery</span></div><div class="info"><b>Education</b><span>B.S. Software Engineering · UTD · Dec 2025</span></div></div><p>At <strong>Infinity Management</strong>, I work across web/mobile product delivery, REST APIs, PostgreSQL, AI-assisted workflows, release testing, troubleshooting and stakeholder demos. Earlier retail leadership at <strong>GongCha</strong> and <strong>Liuyishou</strong> built my confidence in communication, training, customer experience, fast decisions and leading under pressure.</p><p><strong>How I learn:</strong> when new technology catches my attention, I want to understand the mechanism behind it — not just use it. I pull the system apart conceptually, learn how the pieces connect, then look for ways to simplify, improve or innovate when it makes sense.</p><div class="chips"><span class="tag">Full-stack builder</span><span class="tag">Android / iOS</span><span class="tag">AI-curious</span><span class="tag">Customer-first</span><span class="tag">Quick problem solver</span><span class="tag">Confident communicator</span></div>`,projects:`<p>Here are the projects that best show how I think: <strong>understand the workflow → build the system → test the edge cases → explain the value.</strong></p><div class="projectGrid"><div class="project"><small>BUSINESS PLATFORM</small><h3>SyntaxSC</h3><p>Multi-module web/mobile platform supporting CRM, FinSight reporting, BizShield, field service, construction, payroll and client workflows.</p><p class="stack">Node.js · Express · PostgreSQL · REST APIs · Docker · Git</p></div><div class="project"><small>MOBILE PRODUCT</small><h3>DFW Pass</h3><p>Helped evolve a rewards web product toward Expo / React Native Android and iOS apps, with QR check-ins, rewards, businesses/offers and merchant/admin workflows.</p><p class="stack">Expo · React Native · JavaScript · Node.js · PostgreSQL</p></div><div class="project"><small>AI + DATA</small><h3>FinSight AI Import</h3><p>AI-assisted CSV/Excel mapping workflows that transform raw accounting data into structured application and reporting formats.</p><p class="stack">JavaScript · SQL · PostgreSQL · REST APIs · AI mapping</p></div><div class="project"><small>JAVA FULL STACK</small><h3>CSF 2.0 Risk App</h3><p>Cybersecurity assessment app with Spring Boot REST APIs, React UI, PostgreSQL, autosave, run tracking and visual reporting.</p><p class="stack">Java · Spring Boot · React · TypeScript · PostgreSQL · Docker</p></div><div class="project"><small>EMERGING AI</small><h3>Agentic AI Systems</h3><p>Hands-on study and implementation planning around MCP, RAG, multi-agent orchestration, LLM routing, vector search and knowledge graphs.</p><p class="stack">Python · MCP · RAG · pgvector · LiteLLM concepts</p></div><div class="project"><small>SYSTEMS THINKING</small><h3>Monitoring + Incident Response</h3><p>Linux/Python monitoring, alert logging and recovery workflows built to practice fault isolation, escalation and root-cause analysis.</p><p class="stack">Linux · Python · Shell · SQL · RCA</p></div></div>`,skills:`<p>I like a stack that lets me move from an idea to a working product — and then explain it to the people who use it.</p><div class="infoGrid"><div class="info"><b>Frontend & Mobile</b><span>React, TypeScript, JavaScript, HTML/CSS, Expo, React Native, Android/iOS app workflows</span></div><div class="info"><b>Backend & APIs</b><span>Node.js, Express, Java Spring Boot, REST APIs, async workflow concepts</span></div><div class="info"><b>Data</b><span>PostgreSQL, MySQL, SQL reporting, data validation, CSV/Excel imports, KPI dashboards</span></div><div class="info"><b>AI Systems</b><span>Agentic AI concepts, MCP, RAG, multi-agent patterns, LLM routing, vector-search familiarity</span></div><div class="info"><b>DevOps & Systems</b><span>Docker, Git/GitHub, Linux, CI/CD concepts, Kubernetes familiarity, troubleshooting</span></div><div class="info"><b>Product & People</b><span>Requirements, UAT, demos, training, customer experience, leadership, critical thinking</span></div></div><p><strong>Specialty:</strong> I learn new tools fast because I care about the mechanism, not the buzzword. My goal is always to understand <em>why it works</em> well enough to use it responsibly and improve the experience around it.</p>`,contact:`<p>If you're hiring for software, product, solutions/sales engineering, customer technology or a role where strong communication matters, I'd be glad to talk.</p><div class="actionRow"><a class="action primary" href="mailto:Lethaiduong1912@gmail.com">✉ Email me</a><a class="action" href="https://www.linkedin.com/in/duongle1912" target="_blank" rel="noreferrer">LinkedIn ↗</a><a class="action" href="https://github.com/lethaiduong-dev" target="_blank" rel="noreferrer">GitHub ↗</a><a class="action" href="tel:+14692680681">Call / Text</a></div><p style="margin-top:14px"><strong>Email:</strong> Lethaiduong1912@gmail.com<br><strong>Phone:</strong> (469) 268-0681</p><p>I'm especially interested in teams that value <strong>technology, innovation, ownership, communication and customer impact</strong>.</p>`,location:`<div class="locationCard"><div class="pin">⌖</div><div><b>Dallas–Fort Worth, Texas</b><span>Based in North Texas · available for DFW opportunities and travel when the role requires it.</span></div></div><p style="margin-top:14px">I work well in environments where I can collaborate directly with engineers, product teams, managers, customers or retail/field partners. I'm comfortable with <strong>on-site, hybrid and customer-facing work</strong> when it helps the team move faster.</p>`};const qa=[{keys:['mobile','android','ios','react native','expo'],html:`<p>I have <strong>4+ years across web & mobile application development and maintenance</strong>. My current work includes product and integration work across web/mobile systems, while DFW Pass gave me direct Expo / React Native experience for <strong>Android and iOS</strong> workflows, package identifiers, SDK/versioning and cross-platform product features.</p><div class="chips"><span class="tag">Expo</span><span class="tag">React Native</span><span class="tag">Android</span><span class="tag">iOS</span><span class="tag">REST APIs</span></div>`},{keys:['management','manager','leadership','customer service','customer','sales','retail'],html:`<p>I bring <strong>4+ years of customer service and management experience</strong>. At GongCha I led a customer-service team, handled scheduling, training, product knowledge, promotions, KPIs and fast issue resolution. Liuyishou added more hands-on retail leadership, while Infinity strengthened stakeholder demos, user training and professional technical communication.</p><p>That experience is why I'm comfortable speaking with both engineers and customers — I can translate between technical detail and the outcome people actually care about.</p>`},{keys:['ai','agent','rag','mcp','llm'],html:`<p>My AI work is practical and growing: AI-assisted data mapping at Infinity plus focused learning around <strong>agentic AI, MCP, RAG, multi-agent orchestration, LLM routing, vector search and knowledge-graph patterns</strong>. I like understanding the architecture behind emerging tools before deciding where they create real value.</p>`},{keys:['education','degree','school','utd','collin'],html:`<p>I earned a <strong>B.S. in Software Engineering from the University of Texas at Dallas</strong> in December 2025. Before that, I completed an <strong>A.A.S. in Computer Systems — Database Development</strong> at Collin College with a <strong>4.0 GPA</strong>.</p>`},{keys:['infinity','syntax'],html:`<p>At Infinity Management I work across web/mobile product initiatives: multi-module business workflows, REST API and PostgreSQL integration, AI-assisted imports, UAT/release readiness, Docker/Git development, debugging, stakeholder demos and rapid issue resolution. The work has taught me to think beyond one layer of the stack.</p>`},{keys:['gongcha','gong cha','liuyishou'],html:`<p>Retail leadership taught me how to lead when things move fast: train people clearly, prioritize the next problem, watch customer behavior, protect the brand experience and make decisions without waiting for perfect information. Those skills transfer directly into product, sales engineering and customer-facing technology work.</p>`},{keys:['learn','learning','innovation','innovate','new technology'],html:`<p>I learn by asking <strong>“what is happening under the hood?”</strong> I want the mechanism, dependencies and tradeoffs — then I build something small, test it, and connect it to a real problem. If a new tool genuinely improves the workflow, I look for ways to innovate around it instead of adding technology just for the trend.</p>`},{keys:['strength','different','why hire','hire you','personality'],html:`<p>I'm technical, but I don't hide behind technical language. I can <strong>build the product, explain the product, train people on the product and stay calm when the product breaks</strong>. My mix of engineering, product curiosity, customer service and management gives me a communication style that's confident, practical and naturally people-oriented.</p>`}];function sectionResponse(s){return content[s]||content.me}function classify(q){const s=q.toLowerCase();for(const item of qa){if(item.keys.some(k=>s.includes(k)))return item.html}if(/project|work|built|portfolio/.test(s))return content.projects;if(/skill|stack|technology|language|framework/.test(s))return content.skills;if(/contact|email|phone|linkedin|github|reach/.test(s))return content.contact;if(/location|where|based|texas|dallas|dfw/.test(s))return content.location;return `<p>Good question. The fastest way to understand me is this: I'm a <strong>software engineer with 4+ years across web/mobile development plus 4+ years in customer service and management</strong>. I build across APIs, databases, web/mobile products and AI-assisted workflows — and I enjoy explaining technology as much as building it.</p><p>You can ask me about <strong>projects, Android/iOS, skills, AI, Infinity Management, leadership, education, location or contact info</strong>.</p>`}function bubbleUser(q){const row=document.createElement('div');row.className='userRow';const b=document.createElement('div');b.className='userBubble';b.textContent=q;row.appendChild(b);thread.appendChild(row)}function assistantShell(html){const row=document.createElement('div');row.className='assistantBlock';row.innerHTML=`<img class="assistantAvatar" src="${avatar}" alt="Duong avatar"><div class="assistantBody"><div class="assistantName">Duong Le</div><div class="assistantMeta">Software Engineer · Dallas–Fort Worth</div>${html}</div>`;thread.appendChild(row)}function typing(){const row=document.createElement('div');row.className='assistantBlock typingRow';row.innerHTML=`<img class="assistantAvatar" src="${avatar}" alt="Duong avatar"><div class="typing"><i></i><i></i><i></i></div>`;thread.appendChild(row);return row}function enterChat(q,html,replace=true){home.classList.add('hidden');chatView.classList.add('active');app.classList.add('chatMode');document.getElementById('chatControls').style.display='block';if(replace)thread.innerHTML='';bubbleUser(q);const t=typing();setTimeout(()=>{t.remove();assistantShell(html);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})},320);location.hash='chat'}function showSection(section){document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));enterChat(sectionQuestions[section],sectionResponse(section),true)}function ask(q){if(!q.trim())return;enterChat(q,classify(q),false);document.getElementById('chatInput').value='';document.getElementById('homeSearch').value=''}function goHome(){thread.innerHTML='';home.classList.remove('hidden');chatView.classList.remove('active');app.classList.remove('chatMode');document.getElementById('chatControls').style.display='none';location.hash='';window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>showSection(b.dataset.section)));document.getElementById('homeBtn').onclick=goHome;document.getElementById('brandHome').onclick=e=>{e.preventDefault();goHome()};const hs=document.getElementById('homeSearch'),hi=document.getElementById('chatInput');document.getElementById('homeSend').onclick=()=>ask(hs.value);document.getElementById('chatSend').onclick=()=>ask(hi.value);hs.addEventListener('keydown',e=>{if(e.key==='Enter')ask(hs.value)});hi.addEventListener('keydown',e=>{if(e.key==='Enter')ask(hi.value)});const aura=document.getElementById('cursorAura'),aura2=document.getElementById('cursorAura2');let targetX=innerWidth*.2,targetY=innerHeight*.3,x=targetX,y=targetY,x2=x,y2=y;window.addEventListener('pointermove',e=>{targetX=e.clientX;targetY=e.clientY},{passive:true});function animateAura(){x+=(targetX-x)*.13;y+=(targetY-y)*.13;x2+=(targetX-x2)*.055;y2+=(targetY-y2)*.055;aura.style.transform=`translate3d(${x}px,${y}px,0)`;aura2.style.transform=`translate3d(${x2}px,${y2}px,0)`;requestAnimationFrame(animateAura)}animateAura();if(location.hash.startsWith('#chat'))showSection('me');
</script>
