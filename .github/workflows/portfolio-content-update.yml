name: One-time portfolio content update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-content-update.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    if: github.event.head_commit.message == 'Run one-time portfolio content updater'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand projects, skills, and project chat links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          syntax_url = 'https://web.syntaxsc.com/index.html?session_expired=true&reason=Session%20expired%20due%20to%20inactivity'
          dfw_url = 'https://dfw-pass.com/'

          new_projects = r'''projects:`<p>These projects show how I work: <strong>understand the workflow → build the system → test the edge cases → explain the value.</strong> My portfolio combines software engineering with real customer, sales, data and operations problems.</p><div class="projectGrid"><div class="project"><small>BUSINESS + FINTECH PLATFORM</small><h3>SyntaxSC</h3><p>Multi-module web/mobile business platform spanning CRM, FinSight accounting and reporting, SyntaxPrep tax workflows, payroll, field service, construction and client operations. I work across requirements, APIs, PostgreSQL data flows, testing, troubleshooting, release validation and stakeholder demonstrations.</p><p class="stack">Node.js · Express · PostgreSQL · REST APIs · JavaScript · Docker · Git</p><div class="actionRow"><a class="action primary" href="https://web.syntaxsc.com/index.html?session_expired=true&reason=Session%20expired%20due%20to%20inactivity" target="_blank" rel="noreferrer">Open SyntaxSC ↗</a></div></div><div class="project"><small>WEB + MOBILE REWARDS PRODUCT</small><h3>DFW Pass</h3><p>Cross-platform rewards product spanning web and Expo / React Native Android and iOS workflows. My work includes mobile integration, businesses and offers, reward/check-in concepts, merchant/admin workflows, API/data coordination and release/build validation.</p><p class="stack">Expo · React Native · JavaScript · Node.js · PostgreSQL · REST APIs</p><div class="actionRow"><a class="action primary" href="https://dfw-pass.com/" target="_blank" rel="noreferrer">Visit DFW Pass ↗</a></div></div><div class="project"><small>AI + ACCOUNTING DATA</small><h3>FinSight AI Import</h3><p>AI-assisted CSV/Excel mapping workflows that transform inconsistent accounting data into structured application records and financial-reporting formats, with validation, exception handling and SQL/PostgreSQL-backed processing.</p><p class="stack">JavaScript · SQL · PostgreSQL · REST APIs · AI-assisted mapping</p></div><div class="project"><small>ENTERPRISE AI + DATA</small><h3>NTT DATA Enterprise AI Web Integration</h3><p>Designed and integrated AI-assisted functionality into a data-focused enterprise web application for a Dell/Perot Systems-related engagement, supporting data-oriented user workflows, testing, validation and debugging.</p><p class="stack">Enterprise web · AI-assisted integration · Data workflows · Testing · Validation</p></div><div class="project"><small>DATA ENGINEERING ARCHITECTURE STUDY</small><h3>Microsoft Fabric Revenue Analytics</h3><p>Designed an implementation architecture for reusable client ingestion using Fabric pipelines/notebooks, watermark-based incremental loads, MERGE logic and Bronze/Silver/Gold Delta Lake layers. Modeled a revenue star schema and Direct Lake semantic layer with data-quality and SLA monitoring concepts.</p><p class="stack">Microsoft Fabric · OneLake · Lakehouse · Delta · Direct Lake · Power BI semantic models</p></div><div class="project"><small>MACHINE LEARNING + FINANCIAL DATA</small><h3>Financial Fraud Detection API</h3><p>Built a fraud-detection prototype on synthetic financial data using Logistic Regression and Random Forest, then reduced false positives by roughly 16% through feature engineering and anomaly-detection techniques and exposed predictions through FastAPI.</p><p class="stack">Python · SQL · FastAPI · Logistic Regression · Random Forest · Machine Learning</p></div><div class="project"><small>CUSTOMER INTELLIGENCE + SALES</small><h3>Customer Loyalty & Retail Analytics</h3><p>Built and improved customer rewards/loyalty workflows while using customer feedback, loyalty activity and sales/KPI trends to guide promotions and product improvements. Digital and customer-experience changes contributed to approximately 20% higher engagement within three months.</p><p class="stack">Customer data · Loyalty/POS · KPI analysis · Promotions · CRM concepts · Team leadership</p></div><div class="project"><small>ROBOTICS + IOT PROTOTYPE</small><h3>Smart Navigate Drone Prototype</h3><p>Built autonomous quadcopter navigation logic using GPS/sensor data, computer vision and ROS; added real-time obstacle detection, RTSP drone-to-vehicle video communication and AWS IoT telemetry for cloud logging, monitoring and remote debugging.</p><p class="stack">Python · C++ · OpenCV · Linux · ROS/Gazebo · RTSP · AWS IoT Core</p></div><div class="project"><small>JAVA FULL STACK</small><h3>CSF 2.0 Risk App</h3><p>Cybersecurity assessment app with Spring Boot REST APIs, React UI, PostgreSQL, JWT authentication, autosave, run tracking and visual KPI/radar reporting.</p><p class="stack">Java · Spring Boot · React · TypeScript · PostgreSQL · Docker</p></div><div class="project"><small>EMERGING AI</small><h3>Agentic AI Systems</h3><p>Hands-on study and implementation planning around MCP, RAG, multi-agent orchestration, LLM routing, vector search and knowledge-graph concepts, focused on practical business workflows rather than AI for its own sake.</p><p class="stack">Python · MCP · RAG · pgvector · LLM routing · Knowledge-graph concepts</p></div><div class="project"><small>SYSTEMS RELIABILITY</small><h3>Monitoring + Incident Response</h3><p>Built Linux/Python monitoring, alert logging, SQL-backed incident tracking and runbook-style recovery workflows to practice fault isolation, escalation, root-cause analysis and service restoration.</p><p class="stack">Linux · Python · Shell · SQL · Monitoring · RCA</p></div></div>`'''

          start = text.index('projects:`')
          end = text.index(',\nskills:`', start)
          text = text[:start] + new_projects + text[end:]

          new_skills = r'''skills:`<p>I like being able to <strong>build the product, understand the data, explain the value and work directly with the people using it.</strong> My skill set reflects both engineering depth and customer-facing leadership.</p><div class="infoGrid"><div class="info"><b>Frontend & Mobile</b><span>React, TypeScript, JavaScript, HTML/CSS, Expo, React Native, Android/iOS workflows, responsive product experiences</span></div><div class="info"><b>Backend & APIs</b><span>Node.js, Express, Java Spring Boot, Python, Flask/FastAPI, REST APIs, JSON, frontend/backend integration</span></div><div class="info"><b>Data & Analytics</b><span>PostgreSQL, MySQL, SQL, CSV/Excel ingestion, data validation, schema mapping, KPI dashboards, financial analytics, trend analysis</span></div><div class="info"><b>AI & Automation</b><span>AI-assisted workflows, data mapping, agentic AI concepts, MCP, RAG, multi-agent orchestration, LLM routing, vector-search and knowledge-graph familiarity</span></div><div class="info"><b>DevOps & Systems Reliability</b><span>Docker, Git/GitHub, Linux, CI/CD concepts, incident triage, monitoring, release verification, troubleshooting and recovery workflows</span></div><div class="info"><b>Engineering Delivery & Quality</b><span>Requirements analysis, SDLC, UAT, functional/integration/regression testing, root-cause analysis, technical documentation, runbooks, change control; SPC/FMEA/8D/Fishbone familiarity</span></div><div class="info"><b>CRM & Customer Intelligence</b><span>CRM/customer workflows, customer data, audience/behavior insights, loyalty technology, KPI reporting, promotion workflows, HubSpot/MarTech familiarity, Excel reporting</span></div><div class="info"><b>Sales & Product Presentation</b><span>Product demonstrations, consultative selling, product knowledge, brand advocacy, promotions, customer engagement and translating technical features into practical value</span></div><div class="info"><b>Customer Service & Relationships</b><span>Active listening, needs discovery, service recovery, customer escalations, retention mindset, feedback collection and high-volume customer-facing operations</span></div><div class="info"><b>Management & Operations</b><span>15-person team leadership, scheduling, employee training/coaching, task prioritization, stakeholder coordination, KPI tracking, process improvement and fast issue resolution</span></div><div class="info"><b>Business & Financial Domains</b><span>FinTech/accounting, financial reporting, CRM, tax workflows, payroll, construction/field service, healthcare technology, loyalty/rewards and customer operations</span></div><div class="info"><b>Robotics & Networking</b><span>Python/C++, OpenCV, ROS/Gazebo, RTSP, AWS IoT telemetry, TCP/IP and Network+/security foundations</span></div></div><p><strong>How I work:</strong> I learn new tools fast because I care about the mechanism, not the buzzword. I can go from requirements and data to a working solution, test it carefully, present it clearly, train users and stay calm when something breaks.</p>`'''

          start = text.index('skills:`')
          end = text.index(',\ncontact:`', start)
          text = text[:start] + new_skills + text[end:]

          qa_marker = 'const qa=[\n'
          assert qa_marker in text, 'QA marker not found'
          extra_qa = r'''{keys:['dfw pass','dfwpass','rewards platform'],html:`<p><strong>DFW Pass</strong> is a cross-platform rewards product spanning web and Expo / React Native Android and iOS workflows. I work across mobile integration, businesses/offers, reward and merchant/admin concepts, APIs, data coordination and build/release validation.</p><div class="actionRow"><a class="action primary" href="https://dfw-pass.com/" target="_blank" rel="noreferrer">Visit DFW Pass ↗</a></div>`},
{keys:['fabric','power bi','lakehouse','direct lake','bronze','silver','gold'],html:`<p>My <strong>Microsoft Fabric Revenue Analytics</strong> architecture study covers reusable ingestion with pipelines/notebooks, watermark incremental loads, MERGE logic, Bronze/Silver/Gold Delta Lake layers, a revenue star schema, Direct Lake semantic modeling and data-quality/SLA monitoring concepts.</p>`},
{keys:['fraud','fraud detection','logistic regression','random forest'],html:`<p>I built a <strong>Financial Fraud Detection API</strong> prototype using synthetic financial data, Logistic Regression and Random Forest. Feature engineering and anomaly-detection work reduced false positives by roughly 16%, and FastAPI exposed the predictions through REST endpoints.</p>`},
{keys:['loyalty','five star','customer intelligence','customer analytics'],html:`<p>My customer-intelligence work combines <strong>loyalty technology, customer feedback, sales/KPI trends, promotions and frontline operations</strong>. At GongCha, I used those signals to guide product and service improvements that contributed to approximately 20% higher engagement in three months.</p>`},
'''
          if "{keys:['dfw pass','dfwpass','rewards platform']" not in text:
              text = text.replace(qa_marker, qa_marker + extra_qa, 1)

          syntax_qa = r'''{keys:['infinity','syntax'],html:`<p>At Infinity Management I design and develop <strong>SyntaxSC</strong> across web/mobile business workflows. My work includes FinSight accounting/reporting, AI-assisted imports, QuickBooks-style functionality, SyntaxPrep tax workflows, REST APIs, PostgreSQL, UAT/release validation, troubleshooting and stakeholder demos.</p><div class="actionRow"><a class="action primary" href="https://web.syntaxsc.com/index.html?session_expired=true&reason=Session%20expired%20due%20to%20inactivity" target="_blank" rel="noreferrer">Open SyntaxSC ↗</a></div>`},'''
          text, n = re.subn(r"\{keys:\['infinity','syntax'\],html:`.*?`\},", syntax_qa, text, count=1, flags=re.S)
          assert n == 1, 'SyntaxSC QA block not updated'

          leadership_qa = r'''{keys:['management','manager','leadership','customer service','customer','sales','retail'],html:`<p>My people-facing background is a major part of how I work. Across <strong>GongCha and Liuyishou</strong>, I managed staffing, scheduling, training, promotions, KPIs, service standards, customer escalations and fast operational problem solving. I have coached teams on product knowledge and selling techniques, presented products and technology, listened to customer needs and used feedback/data to improve the experience. That helps me bridge <strong>engineering, sales, customer service and management</strong> instead of treating them as separate worlds.</p>`},'''
          text, n = re.subn(r"\{keys:\['management','manager','leadership','customer service','customer','sales','retail'\],html:`.*?`\},", leadership_qa, text, count=1, flags=re.S)
          assert n == 1, 'Leadership QA block not updated'

          required = [
              syntax_url,
              dfw_url,
              'Microsoft Fabric Revenue Analytics',
              'Financial Fraud Detection API',
              'Customer Loyalty & Retail Analytics',
              'NTT DATA Enterprise AI Web Integration',
              'Sales & Product Presentation',
              'Customer Service & Relationships',
              'Management & Operations',
              'Engineering Delivery & Quality',
          ]
          for item in required:
              assert item in text, f'Missing required portfolio content: {item}'

          assert text.count('<div class="project">') >= 11, 'Expected at least 11 project cards'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate generated portfolio JavaScript and links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert scripts, 'No inline JavaScript found'
          Path('/tmp/portfolio.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'https://dfw-pass.com/' in html
          assert 'https://web.syntaxsc.com/index.html?session_expired=true&reason=Session%20expired%20due%20to%20inactivity' in html
          PY
          node --check /tmp/portfolio.js
          git diff --check

      - name: Commit portfolio update
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No portfolio changes were needed.'
            exit 0
          fi
          git config user.name 'Duong (Tyler) Le'
          git config user.email '79069641+lethaiduong-dev@users.noreply.github.com'
          git add index.html
          git commit -m 'Expand portfolio projects and cross-functional skills'
          git push origin HEAD:main
