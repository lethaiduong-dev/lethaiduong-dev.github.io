name: Portfolio content update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portfolio-content-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update portfolio content
        run: python .github/scripts/update_portfolio_once.py

      - name: Validate JavaScript and diff
        run: |
          node --check /tmp/portfolio.js
          git diff --check

      - name: Commit portfolio update
        run: |
          if git diff --quiet; then
            echo 'No portfolio changes were needed.'
            exit 0
          fi
          git config user.name 'Duong (Tyler) Le'
          git config user.email '79069641+lethaiduong-dev@users.noreply.github.com'
          git add index.html
          git commit -m 'Expand portfolio projects and cross-functional skills'
          git push origin HEAD:main
